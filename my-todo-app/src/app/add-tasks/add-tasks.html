<h2>Add Task</h2>
<mat-form-field>
  <mat-label>Title</mat-label>
  <input matInput [(ngModel)]="title" name="title">
</mat-form-field>
<mat-form-field>
  <mat-label>Select</mat-label>
  <mat-select [(ngModel)]="priority" name="priority">
    <mat-option value="High">High</mat-option>
    <mat-option value="Medium">Medium</mat-option>
    <mat-option value="Normal">Normal</mat-option>
    <mat-option value="Low">Low</mat-option>
  </mat-select>
</mat-form-field>
<mat-form-field>
  <mat-label>Description</mat-label>
  <textarea matInput [(ngModel)]="description" name="description"></textarea>
</mat-form-field>
<section>
  <div class="example-button-row">
    <button matButton="filled" (click)="onSelectSubmit()">Submit</button>
  </div>
</section>
