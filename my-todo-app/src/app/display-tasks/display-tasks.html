@for (task of tasks; track task.id) {
  <p>
 <mat-card class="example-card" [ngClass]="task.priority">
    <mat-card-header>
      <mat-card-title><b>Title:</b>{{ task.title }}</mat-card-title>      
      <mat-card-subtitle><b>Task ID:</b>{{ task.id }}</mat-card-subtitle>      
      <mat-card-subtitle><b>Priority:</b>{{ task.priority }}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p><b>Description:</b>{{ task.description }}</p>
    </mat-card-content>
  </mat-card>
  </p>
 
}
<!--
High - red
Medium - orange
Normal - blue
Low - green
-->
